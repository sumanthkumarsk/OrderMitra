version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ordermitra-postgres
    restart: always
    environment:
      POSTGRES_USER: ordermitra
      POSTGRES_PASSWORD: ordermitra_password
      POSTGRES_DB: ordermitradb
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ordermitra-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
