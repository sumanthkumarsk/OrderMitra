<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cart — Annapurna Kitchen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
  <style>
    body { background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }
    .cart-header {
      background: white; border-bottom: 1px solid var(--border-light);
      padding: 1rem 1.25rem; display: flex; align-items: center; gap: 0.75rem;
      position: sticky; top: 0; z-index: 50;
    }
    .cart-back { width: 36px; height: 36px; border: none; background: var(--bg); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.125rem; }
    .cart-title { font-weight: 700; font-size: 1.125rem; }
    .cart-body { flex: 1; padding: 1rem; padding-bottom: 200px; max-width: 600px; margin: 0 auto; width: 100%; }
    .cart-section-label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; margin-top: 1rem; }
    .cart-item {
      display: flex; align-items: center; gap: 0.875rem;
      padding: 0.875rem; background: white; border-radius: var(--radius);
      border: 1px solid var(--border-light); margin-bottom: 0.5rem;
    }
    .cart-item-icon {
      width: 48px; height: 48px; border-radius: var(--radius-sm);
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; flex-shrink: 0;
    }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 600; font-size: 0.9375rem; }
    .cart-item-price { font-size: 0.8125rem; color: var(--text-secondary); }
    .cart-item-qty {
      display: flex; align-items: center; gap: 0;
      border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden;
    }
    .cart-qty-btn {
      width: 32px; height: 32px; border: none; background: var(--bg);
      font-size: 1rem; cursor: pointer; font-weight: 600;
    }
    .cart-qty-btn:hover { background: var(--border-light); }
    .cart-qty-val { min-width: 28px; text-align: center; font-weight: 600; font-size: 0.875rem; }
    .cart-item-total { font-weight: 700; font-size: 0.9375rem; min-width: 50px; text-align: right; }
    .cart-item-note {
      font-size: 0.75rem; color: var(--text-muted); font-style: italic;
      padding: 0.25rem 0.5rem; background: var(--bg); border-radius: 4px;
      margin-top: 0.25rem; display: inline-block; cursor: pointer;
    }
    .cart-item-remove {
      border: none; background: none; color: var(--danger); cursor: pointer;
      font-size: 0.75rem; font-weight: 600; padding: 0.25rem;
    }
    .cart-note-section {
      margin-top: 1rem; padding: 1rem; background: white;
      border-radius: var(--radius); border: 1px solid var(--border-light);
    }
    .cart-note-section label { font-weight: 600; font-size: 0.8125rem; display: block; margin-bottom: 0.5rem; }
    .cart-note-section input {
      width: 100%; padding: 0.5rem 0.75rem; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.875rem; outline: none;
    }
    .cart-note-section input:focus { border-color: var(--primary); }

    /* Checkout sticky footer */
    .checkout-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: white; border-top: 2px solid var(--border-light);
      padding: 1rem 1.25rem; z-index: 50;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
    }
    .checkout-breakdown {
      display: flex; flex-direction: column; gap: 0.25rem;
      margin-bottom: 0.75rem; font-size: 0.875rem;
    }
    .checkout-row { display: flex; justify-content: space-between; }
    .checkout-row.total { font-weight: 700; font-size: 1.125rem; border-top: 1px solid var(--border-light); padding-top: 0.5rem; margin-top: 0.25rem; }
    .checkout-btn {
      width: 100%; padding: 0.875rem;
      background: var(--primary); color: white; border: none;
      border-radius: var(--radius); font-weight: 700; font-size: 1rem;
      cursor: pointer; transition: all var(--transition);
    }
    .checkout-btn:hover { background: var(--primary-dark); }
    .checkout-btn:disabled { background: var(--border); cursor: not-allowed; }
    .checkout-btn .btn-sub { font-weight: 400; font-size: 0.8125rem; opacity: 0.8; }

    /* Empty cart */
    .empty-cart {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 3rem; color: var(--text-muted);
    }
    .empty-cart-icon { font-size: 4rem; margin-bottom: 1rem; opacity: 0.4; }
    .empty-cart h3 { color: var(--text-secondary); margin-bottom: 0.5rem; }
  </style>
</head>
<body>

  <div class="cart-header">
    <button class="cart-back" onclick="history.back()">←</button>
    <div class="cart-title">Your Order</div>
  </div>

  <div class="cart-body" id="cartBody">
    <div class="cart-section-label">Your Items</div>

    <div class="cart-item">
      <div class="cart-item-icon">🍗</div>
      <div class="cart-item-info">
        <div class="cart-item-name">Chicken 65</div>
        <div class="cart-item-price">₹260 each</div>
        <div class="cart-item-note" onclick="editNote(this)">+ Add special instructions</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.25rem;">
        <div class="cart-item-qty">
          <button class="cart-qty-btn">−</button>
          <span class="cart-qty-val">2</span>
          <button class="cart-qty-btn">+</button>
        </div>
        <button class="cart-item-remove">Remove</button>
      </div>
      <div class="cart-item-total">₹520</div>
    </div>

    <div class="cart-item">
      <div class="cart-item-icon">🫓</div>
      <div class="cart-item-info">
        <div class="cart-item-name">Butter Naan</div>
        <div class="cart-item-price">₹50 each</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.25rem;">
        <div class="cart-item-qty">
          <button class="cart-qty-btn">−</button>
          <span class="cart-qty-val">4</span>
          <button class="cart-qty-btn">+</button>
        </div>
        <button class="cart-item-remove">Remove</button>
      </div>
      <div class="cart-item-total">₹200</div>
    </div>

    <div class="cart-item">
      <div class="cart-item-icon">🍚</div>
      <div class="cart-item-info">
        <div class="cart-item-name">Chicken Biryani</div>
        <div class="cart-item-price">₹280 each</div>
        <div class="cart-item-note">No onions, extra raita</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.25rem;">
        <div class="cart-item-qty">
          <button class="cart-qty-btn">−</button>
          <span class="cart-qty-val">1</span>
          <button class="cart-qty-btn">+</button>
        </div>
        <button class="cart-item-remove">Remove</button>
      </div>
      <div class="cart-item-total">₹280</div>
    </div>

    <div class="cart-item">
      <div class="cart-item-icon">🍋</div>
      <div class="cart-item-info">
        <div class="cart-item-name">Lime Soda</div>
        <div class="cart-item-price">₹60 each</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:0.25rem;">
        <div class="cart-item-qty">
          <button class="cart-qty-btn">−</button>
          <span class="cart-qty-val">2</span>
          <button class="cart-qty-btn">+</button>
        </div>
        <button class="cart-item-remove">Remove</button>
      </div>
      <div class="cart-item-total">₹120</div>
    </div>

    <div class="cart-note-section">
      <label>Special Instructions (optional)</label>
      <input type="text" placeholder="e.g., Extra spicy, no coriander, allergens...">
    </div>
  </div>

  <!-- Checkout Footer -->
  <div class="checkout-footer">
    <div class="checkout-breakdown">
      <div class="checkout-row">
        <span>Subtotal (9 items)</span>
        <span>₹1,120</span>
      </div>
      <div class="checkout-row">
        <span>Taxes (5% GST)</span>
        <span>₹56</span>
      </div>
      <div class="checkout-row total">
        <span>Total</span>
        <span>₹1,176</span>
      </div>
    </div>
    <button class="checkout-btn" onclick="placeOrder()">
      Place Order · ₹1,176
      <div class="btn-sub">Order ID will be generated</div>
    </button>
  </div>

  <script>
    function placeOrder() {
      const btn = document.querySelector('.checkout-btn');
      btn.innerHTML = '<span class="animate-pulse">Placing order...</span>';
      btn.disabled = true;
      setTimeout(() => {
        window.location.href = 'order-status.html';
      }, 1500);
    }
  </script>
</body>
</html>
