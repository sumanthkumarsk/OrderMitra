<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Your Order — OrderMitra</title>
  <link rel="stylesheet" href="../css/shared.css">
  <style>
    body { background: var(--bg); display: flex; flex-direction: column; min-height: 100vh; }
    
    .cart-header {
      background: var(--bg-white); border-bottom: 1px solid var(--border-light);
      padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.75rem;
      position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow-sm);
    }
    .cart-back { 
      width: 32px; height: 32px; border: none; background: var(--bg); border-radius: 50%; 
      cursor: pointer; display: flex; align-items: center; justify-content: center; 
      font-size: 1.125rem; transition: background var(--transition);
    }
    .cart-back:hover { background: var(--border-light); }
    .cart-title { font-weight: 800; font-size: 1.125rem; font-family: var(--font-display); }
    
    .main-container {
      flex: 1; padding: 1rem 1rem; padding-bottom: 180px;
      max-width: 800px; margin: 0 auto; width: 100%;
    }
    
    @media (min-width: 1024px) {
      .main-container {
        display: grid; grid-template-columns: 1fr 360px; gap: 2rem;
        max-width: 1200px; padding-bottom: 3rem; align-items: start;
      }
    }

    .cart-section-label { 
      font-family: var(--font-display); font-size: 1.125rem; font-weight: 800; 
      color: var(--text); margin-bottom: 0.75rem; 
    }
    
    .cart-items { display: flex; flex-direction: column; gap: 0; margin-bottom: 1.5rem; background: var(--bg-white); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    
    .cart-item {
      display: flex; align-items: flex-start; gap: 0.75rem;
      padding: 1rem; border-bottom: 1px solid var(--border-light);
    }
    .cart-item:last-child { border-bottom: none; }
    .cart-item-icon {
      width: 48px; height: 48px; border-radius: var(--radius-sm);
      background: var(--bg); display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 700; font-size: 0.9375rem; font-family: var(--font-display); color: var(--text); margin-bottom: 0.125rem; }
    .cart-item-price { font-size: 0.8125rem; color: var(--text-secondary); margin-bottom: 0.5rem; }
    
    .cart-item-note {
      font-size: 0.75rem; color: var(--primary-dark); font-style: italic;
      padding: 0.25rem 0.5rem; background: var(--primary-light); border-radius: 4px;
      margin-top: 0.25rem; display: inline-block; cursor: pointer; font-weight: 500;
    }
    .cart-item-note:hover { background: #FDE8E4; }
    .cart-item-note.empty { background: var(--bg); color: var(--text-muted); font-style: normal; border: 1px dashed var(--border); }
    
    .cart-item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
    .cart-item-total { font-weight: 700; font-size: 0.9375rem; min-width: 60px; text-align: right; color: var(--text); }
    
    .cart-qty-wrapper { display: flex; align-items: center; gap: 0.5rem; }
    .cart-item-qty {
      display: flex; align-items: center; gap: 0;
      border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
    }
    .cart-qty-btn {
      width: 24px; height: 24px; border: none; background: var(--bg-white); color: var(--primary);
      font-size: 1rem; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .cart-qty-btn:hover { background: var(--bg); }
    .cart-qty-val { min-width: 24px; text-align: center; font-weight: 600; font-size: 0.875rem; border-left: 1px solid var(--border-light); border-right: 1px solid var(--border-light); display: flex; align-items: center; justify-content: center; }
    
    .cart-item-remove {
      border: none; background: none; color: var(--text-muted); cursor: pointer;
      font-size: 0.875rem; font-weight: 600; text-decoration: underline; transition: color var(--transition);
    }
    .cart-item-remove:hover { color: var(--danger); }
    
    .cart-note-section {
      padding: 1rem; background: var(--bg-white);
      border-radius: var(--radius-sm); border: 1px solid var(--border);
    }
    .cart-note-section label { font-family: var(--font-display); font-weight: 700; font-size: 0.9375rem; display: block; margin-bottom: 0.5rem; }
    .cart-note-section input {
      width: 100%; padding: 0.625rem 0.875rem; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.875rem; outline: none; transition: border-color var(--transition);
    }
    .cart-note-section input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }

    /* Checkout Area */
    .checkout-area {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg-white); border-top: 1px solid var(--border);
      padding: 1rem; z-index: 50; box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
    }
    @media (min-width: 1024px) {
      .checkout-area {
        position: sticky; top: 80px; padding: 1.25rem; border: 1px solid var(--border);
        border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
      }
    }
    
    .checkout-title { font-family: var(--font-display); font-weight: 800; font-size: 1.125rem; margin-bottom: 0.75rem; display: none; }
    @media (min-width: 1024px) { .checkout-title { display: block; } }

    .checkout-breakdown {
      display: flex; flex-direction: column; gap: 0.25rem;
      margin-bottom: 0.75rem; font-size: 0.875rem; color: var(--text-secondary);
    }
    .checkout-row { display: flex; justify-content: space-between; align-items: center; }
    .checkout-row.total { 
      font-weight: 800; font-size: 1.125rem; font-family: var(--font-display); color: var(--text); 
      border-top: 1px dashed var(--border); padding-top: 0.5rem; margin-top: 0.25rem; 
    }
    
    .checkout-btn {
      width: 100%; padding: 0.75rem;
      background: var(--primary); color: white; border: none;
      border-radius: var(--radius-sm); font-weight: 700; font-size: 0.9375rem;
      cursor: pointer; transition: all var(--transition); box-shadow: 0 2px 8px rgba(226, 74, 41, 0.2);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.125rem;
    }
    .checkout-btn:hover { background: var(--primary-dark); }
    .checkout-btn:disabled { background: var(--border); box-shadow: none; cursor: not-allowed; transform: none; }
    .checkout-btn .btn-sub { font-weight: 500; font-size: 0.8125rem; opacity: 0.9; }

  </style>
</head>
<body>

  <div class="cart-header">
    <button class="cart-back" onclick="history.back()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="cart-title">Your Order</div>
  </div>

  <div class="main-container">
    <div class="cart-left" id="cartBody">
      <div class="cart-section-label">Order Items</div>

      <div class="cart-items">
        <div class="cart-item">
          <div class="cart-item-icon">🍗</div>
          <div class="cart-item-info">
            <div class="cart-item-name">Chicken 65</div>
            <div class="cart-item-price">₹260 each</div>
            <div class="cart-item-note empty" onclick="editNote(this)">+ Add special instructions</div>
          </div>
          <div class="cart-item-actions">
            <div class="cart-item-total">₹520</div>
            <div class="cart-qty-wrapper">
              <div class="cart-item-qty">
                <button class="cart-qty-btn">−</button>
                <span class="cart-qty-val">2</span>
                <button class="cart-qty-btn">+</button>
              </div>
            </div>
            <button class="cart-item-remove">Remove</button>
          </div>
        </div>

        <div class="cart-item">
          <div class="cart-item-icon">🫓</div>
          <div class="cart-item-info">
            <div class="cart-item-name">Butter Naan</div>
            <div class="cart-item-price">₹50 each</div>
          </div>
          <div class="cart-item-actions">
            <div class="cart-item-total">₹200</div>
            <div class="cart-qty-wrapper">
              <div class="cart-item-qty">
                <button class="cart-qty-btn">−</button>
                <span class="cart-qty-val">4</span>
                <button class="cart-qty-btn">+</button>
              </div>
            </div>
            <button class="cart-item-remove">Remove</button>
          </div>
        </div>

        <div class="cart-item">
          <div class="cart-item-icon">🍛</div>
          <div class="cart-item-info">
            <div class="cart-item-name">Chicken Biryani</div>
            <div class="cart-item-price">₹280 each</div>
            <div class="cart-item-note">No onions, extra raita</div>
          </div>
          <div class="cart-item-actions">
            <div class="cart-item-total">₹280</div>
            <div class="cart-qty-wrapper">
              <div class="cart-item-qty">
                <button class="cart-qty-btn">−</button>
                <span class="cart-qty-val">1</span>
                <button class="cart-qty-btn">+</button>
              </div>
            </div>
            <button class="cart-item-remove">Remove</button>
          </div>
        </div>

        <div class="cart-item">
          <div class="cart-item-icon">🍋</div>
          <div class="cart-item-info">
            <div class="cart-item-name">Lime Soda</div>
            <div class="cart-item-price">₹60 each</div>
          </div>
          <div class="cart-item-actions">
            <div class="cart-item-total">₹120</div>
            <div class="cart-qty-wrapper">
              <div class="cart-item-qty">
                <button class="cart-qty-btn">−</button>
                <span class="cart-qty-val">2</span>
                <button class="cart-qty-btn">+</button>
              </div>
            </div>
            <button class="cart-item-remove">Remove</button>
          </div>
        </div>
      </div>

      <div class="cart-note-section">
        <label>Cooking Instructions (Optional)</label>
        <input type="text" placeholder="e.g., Make it extra spicy, food allergies...">
      </div>
    </div>

    <!-- Checkout Footer / Sidebar -->
    <div class="checkout-area">
      <div class="checkout-title">Bill Details</div>
      <div class="checkout-breakdown">
        <div class="checkout-row">
          <span>Item Total (9 items)</span>
          <span>₹1,120</span>
        </div>
        <div class="checkout-row">
          <span>Taxes (5% GST)</span>
          <span>₹56</span>
        </div>
        <div class="checkout-row total">
          <span>Grand Total</span>
          <span>₹1,176</span>
        </div>
      </div>
      <button class="checkout-btn" onclick="placeOrder()">
        <span>Place Order · ₹1,176</span>
        <div class="btn-sub">Your table session will be updated</div>
      </button>
    </div>
  </div>

  <script>
    function placeOrder() {
      const btn = document.querySelector('.checkout-btn');
      btn.innerHTML = '<span class="animate-pulse" style="font-size: 1.0625rem; font-weight: 700;">Sending Order to Kitchen...</span>';
      btn.disabled = true;
      setTimeout(() => {
        window.location.href = 'order-status.html';
      }, 1500);
    }
  </script>
</body>
</html>
