<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ScanServe — Choose Your Language</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
  <style>
    body {
      background: linear-gradient(160deg, #1D3557 0%, #264673 40%, #1D3557 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      color: white;
    }
    .lang-screen { width: 100%; max-width: 420px; text-align: center; }
    .restaurant-brand {
      margin-bottom: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .restaurant-logo {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      border: 3px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
    }
    .restaurant-name {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .restaurant-tagline {
      font-size: 0.9375rem;
      color: rgba(255,255,255,0.65);
      font-weight: 400;
    }
    .lang-prompt {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: rgba(255,255,255,0.9);
    }
    .lang-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .lang-btn {
      padding: 1.125rem 1rem;
      border-radius: var(--radius);
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: white;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.375rem;
      backdrop-filter: blur(8px);
      position: relative;
      overflow: hidden;
    }
    .lang-btn:hover, .lang-btn:active {
      border-color: var(--primary);
      background: rgba(230,57,70,0.2);
      transform: scale(1.03);
    }
    .lang-btn.selected {
      border-color: var(--primary);
      background: rgba(230,57,70,0.25);
      box-shadow: 0 0 20px rgba(230,57,70,0.3);
    }
    .lang-btn-native { font-size: 1.25rem; font-weight: 700; line-height: 1.2; }
    .lang-btn-english { font-size: 0.75rem; color: rgba(255,255,255,0.6); font-weight: 500; }
    .lang-btn-check {
      position: absolute;
      top: 8px; right: 8px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--primary);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 0.625rem;
    }
    .lang-btn.selected .lang-btn-check { display: flex; }

    .lang-btn-single {
      grid-column: 1 / -1;
      padding: 1.125rem 1rem;
      border-radius: var(--radius);
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: white;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.375rem;
      backdrop-filter: blur(8px);
    }
    .lang-btn-single:hover { border-color: var(--primary); background: rgba(230,57,70,0.2); }

    .enter-btn {
      margin-top: 2rem;
      width: 100%;
      padding: 1rem;
      border-radius: var(--radius);
      border: none;
      background: var(--primary);
      color: white;
      font-size: 1.0625rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      opacity: 0.5;
      pointer-events: none;
    }
    .enter-btn.active {
      opacity: 1;
      pointer-events: all;
    }
    .enter-btn.active:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(230,57,70,0.4);
    }
    .powered-by {
      margin-top: 2rem;
      font-size: 0.6875rem;
      color: rgba(255,255,255,0.3);
    }
    .powered-by span { font-weight: 700; color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <div class="lang-screen">
    <div class="restaurant-brand">
      <div class="restaurant-logo">🍽️</div>
      <div class="restaurant-name">Annapurna Kitchen</div>
      <div class="restaurant-tagline">Authentic South Indian Cuisine</div>
    </div>

    <div class="lang-prompt">Choose your language</div>

    <div class="lang-grid" id="langGrid">
      <button class="lang-btn" data-lang="en" onclick="selectLang(this)">
        <div class="lang-btn-check">✓</div>
        <div class="lang-btn-native">English</div>
        <div class="lang-btn-english">English</div>
      </button>
      <button class="lang-btn" data-lang="kn" onclick="selectLang(this)">
        <div class="lang-btn-check">✓</div>
        <div class="lang-btn-native">ಕನ್ನಡ</div>
        <div class="lang-btn-english">Kannada</div>
      </button>
      <button class="lang-btn" data-lang="hi" onclick="selectLang(this)">
        <div class="lang-btn-check">✓</div>
        <div class="lang-btn-native">हिंदी</div>
        <div class="lang-btn-english">Hindi</div>
      </button>
      <button class="lang-btn" data-lang="ta" onclick="selectLang(this)">
        <div class="lang-btn-check">✓</div>
        <div class="lang-btn-native">தமிழ்</div>
        <div class="lang-btn-english">Tamil</div>
      </button>
      <button class="lang-btn" data-lang="te" onclick="selectLang(this)">
        <div class="lang-btn-check">✓</div>
        <div class="lang-btn-native">తెలుగు</div>
        <div class="lang-btn-english">Telugu</div>
      </button>
    </div>

    <button class="enter-btn" id="enterBtn" onclick="enterMenu()">
      View Menu →
    </button>

    <div class="powered-by">Powered by <span>ScanServe</span></div>
  </div>

  <script>
    function selectLang(btn) {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('enterBtn').classList.add('active');
    }
    function enterMenu() {
      const selected = document.querySelector('.lang-btn.selected');
      if (!selected) return;
      const lang = selected.dataset.lang;
      window.location.href = `menu.html?lang=${lang}`;
    }
  </script>
</body>
</html>
