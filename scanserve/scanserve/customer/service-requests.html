<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Service Request — OrderMitra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
  <style>
    body { background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }
    
    .status-header {
      background: var(--bg-white); border-bottom: 1px solid var(--border-light);
      padding: 0.75rem 1rem; display: flex; align-items: center; gap: 0.75rem;
      position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow-sm);
    }
    .status-back { 
      width: 32px; height: 32px; border: none; background: var(--bg); border-radius: 50%; 
      cursor: pointer; display: flex; align-items: center; justify-content: center; 
      font-size: 1.125rem; transition: background var(--transition);
    }
    .status-back:hover { background: var(--border-light); }
    .status-title { font-weight: 800; font-size: 1.125rem; font-family: var(--font-display); }

    .main-container { flex: 1; padding: 1rem; max-width: 600px; margin: 0 auto; width: 100%; }

    .service-hero {
      text-align: center; padding: 1.5rem 1rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: var(--radius-sm); color: white; margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .service-hero-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .service-hero-title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; margin-bottom: 0.25rem; }
    .service-hero-sub { font-size: 0.8125rem; color: rgba(255,255,255,0.8); }

    .request-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem;
    }
    .request-card {
      background: var(--bg-white); border-radius: var(--radius-sm);
      border: 1px solid var(--border); padding: 1rem;
      text-align: center; cursor: pointer; transition: all var(--transition);
      box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: center; gap: 0.375rem;
    }
    .request-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow); }
    .request-icon { font-size: 1.75rem; }
    .request-label { font-weight: 700; font-size: 0.875rem; font-family: var(--font-display); color: var(--text); }
    
    .custom-request {
      margin-top: 1.5rem; background: var(--bg-white); border-radius: var(--radius-sm);
      border: 1px solid var(--border); padding: 1rem; box-shadow: var(--shadow-sm);
    }
    .custom-label { font-family: var(--font-display); font-weight: 700; font-size: 0.9375rem; margin-bottom: 0.5rem; display: block; }
    .custom-input {
      width: 100%; padding: 0.625rem 0.875rem; border: 1px solid var(--border);
      border-radius: var(--radius-sm); font-size: 0.875rem; outline: none; margin-bottom: 1rem;
    }
    .custom-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
    .btn-submit {
      width: 100%; padding: 0.75rem; background: var(--primary); color: white;
      border: none; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.9375rem;
      cursor: pointer; box-shadow: 0 2px 8px rgba(226, 74, 41, 0.2); transition: all var(--transition);
    }
    .btn-submit:hover { background: var(--primary-dark); }
  </style>
</head>
<body>

  <div class="status-header">
    <button class="status-back" onclick="history.back()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="status-title">Service Requests</div>
  </div>

  <div class="main-container">
    <div class="service-hero">
      <div class="service-hero-icon">🛎️</div>
      <div class="service-hero-title">Need Something?</div>
      <div class="service-hero-sub">Tap below to call the waiter to Table 12</div>
    </div>

    <div class="request-grid">
      <div class="request-card" onclick="alert('Request sent to waiter.')">
        <div class="request-icon">💧</div>
        <div class="request-label">Water</div>
      </div>
      <div class="request-card" onclick="alert('Request sent to waiter.')">
        <div class="request-icon">🧻</div>
        <div class="request-label">Tissues / Wipes</div>
      </div>
      <div class="request-card" onclick="alert('Request sent to waiter.')">
        <div class="request-icon">🍽️</div>
        <div class="request-label">Extra Plates</div>
      </div>
      <div class="request-card" onclick="alert('Request sent to waiter.')">
        <div class="request-icon">🧹</div>
        <div class="request-label">Clean Table</div>
      </div>
    </div>

    <div class="custom-request">
      <label class="custom-label">Other Request</label>
      <input type="text" class="custom-input" placeholder="e.g. Please bring extra salt">
      <button class="btn-submit" onclick="alert('Request sent.')">Send to Waiter</button>
    </div>
  </div>

</body>
</html>
